<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f6f4">
<title>Votre devis</title>
<!--
  Page « Accepter le devis » de Cosmo. Statique : à publier telle quelle sur un hébergement HTTPS (voir MISE-EN-SERVICE.md),
  puis donner son adresse au serveur : supabase secrets set COSMO_DEVIS_PAGE=https://…/devis/
  Elle lit le devis et envoie la réponse du client à la fonction Supabase cosmo-devis (JSON, CORS).
-->
<style>
  :root {
    --fond: #f6f6f4; --carte: #ffffff; --encre: #15161b; --doux: #5f6168; --pale: #8c8e95; --trait: #e7e7e3;
    --vert: #138a46; --vert-fond: #e8f6ee; --rouge: #b42318; --accent: #ff5a1f;
    --rayon: 18px; --ombre: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--fond); color: var(--encre);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 620px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .entreprise { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
  .monogramme { width: 44px; height: 44px; border-radius: 12px; background: var(--encre); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 17px; flex: none; }
  .entreprise b { display: block; font-size: 17px; line-height: 1.25; }
  .entreprise span { color: var(--doux); font-size: 14px; }
  .carte { background: var(--carte); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 20px; margin-bottom: 14px; }
  .surtitre { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pale); margin: 0 0 4px; }
  h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.02em; margin: 0; }
  .objet { color: var(--doux); margin: 4px 0 0; }
  .montant { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 2px; flex-wrap: wrap; }
  .montant strong { font-size: 38px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .montant span { color: var(--doux); font-weight: 600; }
  .meta { color: var(--doux); font-size: 14px; margin: 6px 0 0; }
  .lignes { list-style: none; margin: 0; padding: 0; }
  .lignes li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--trait); }
  .lignes li:first-child { border-top: 0; padding-top: 0; }
  .lignes .designation { white-space: pre-line; }
  .lignes small { display: block; color: var(--pale); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .lignes .prix { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .totaux { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--trait); }
  .totaux div { display: flex; justify-content: space-between; color: var(--doux); font-variant-numeric: tabular-nums; padding: 2px 0; }
  .totaux .ttc { color: var(--encre); font-weight: 700; font-size: 18px; padding-top: 6px; }
  .bouton { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px;
    border-radius: 14px; border: 0; font: inherit; font-weight: 650; font-size: 17px; cursor: pointer; text-decoration: none;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform .12s ease, opacity .12s ease; }
  .bouton:active { transform: scale(.98); }
  .bouton[disabled] { opacity: .5; cursor: default; }
  .principal { background: var(--vert); color: #fff; }
  .secondaire { background: #ececea; color: var(--encre); }
  .fonce { background: var(--encre); color: #fff; }
  .discret { background: transparent; color: var(--doux); min-height: 44px; font-weight: 600; font-size: 16px; }
  .pdf { background: var(--carte); color: var(--encre); box-shadow: var(--ombre); margin-bottom: 14px; }
  .choix { display: grid; gap: 10px; }
  h2 { font-size: 19px; letter-spacing: -.01em; margin: 0 0 12px; }
  label { display: block; font-weight: 600; font-size: 15px; margin: 0 0 6px; }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #d6d6d1; background: #fff; color: var(--encre); }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--encre); outline-offset: 0; border-color: transparent; }
  textarea { min-height: 110px; resize: vertical; }
  .case { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0 16px; font-weight: 500; cursor: pointer; }
  .case input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--vert); }
  .aide { color: var(--doux); font-size: 14px; margin: 8px 0 14px; }
  .erreur { color: var(--rouge); font-size: 15px; margin: 10px 0 0; min-height: 0; }
  .etat { text-align: center; padding: 30px 20px; }
  .pastille { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 30px; }
  .pastille.ok { background: var(--vert-fond); color: var(--vert); }
  .pastille.info { background: #eef1f8; color: #3655a8; }
  .pastille.non { background: #f3f3f1; color: var(--doux); }
  .etat h1 { font-size: 23px; }
  .etat p { color: var(--doux); margin: 8px 0 0; }
  .note { background: #eef1f8; color: #24356b; border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 0 0 14px; }
  .contact { color: var(--doux); font-size: 14px; text-align: center; margin: 22px 0 0; }
  .contact a { color: var(--encre); }
  footer { color: var(--pale); font-size: 12px; text-align: center; margin-top: 18px; }
  .cache { display: none !important; }
  .chargement { height: 180px; border-radius: var(--rayon); background: linear-gradient(90deg, #ececea 0%, #f4f4f2 50%, #ececea 100%);
    background-size: 200% 100%; animation: brille 1.2s linear infinite; }
  @keyframes brille { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .chargement { animation: none; } .bouton { transition: none; } }
</style>
</head>
<body>
<main id="page" aria-live="polite">
  <div class="chargement" aria-label="Chargement du devis"></div>
</main>
<script>
"use strict";
// Fonction du serveur ; une autre adresse n'est acceptée qu'en essai sur le Mac (localhost)
const API_DEFAUT = "https://zqbosemrskrwvzlsaqay.supabase.co/functions/v1/cosmo-devis";
const params = new URLSearchParams(location.search);
const local = ["localhost", "127.0.0.1"].includes(location.hostname);
const API = (local && params.get("api")) || API_DEFAUT;
const jeton = params.get("t") || "";
const page = document.getElementById("page");
let devis = null;
let chargeLe = 0;

const euros = (v) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(v || 0).replace(/ /g, " ");
const nombre = (v) => new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 }).format(v || 0);
const dateLongue = (s) => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }).replace(/^1 /, "1er ") : "";

/** Petit constructeur d'éléments : jamais d'HTML venu du serveur */
function el(tag, attrs = {}, ...enfants) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of enfants.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

function afficher(...noeuds) {
  page.replaceChildren(...noeuds.filter((n) => n !== null && n !== undefined && n !== ""));
  window.scrollTo({ top: 0 });
}

function initiales(nom) {
  return (nom || "").split(/\s+/).filter((m) => /[A-Za-zÀ-ÿ]/.test(m)).slice(0, 2).map((m) => m[0]).join("").toUpperCase() || "·";
}

function entete(d) {
  const e = d?.entreprise || {};
  return el("div", { class: "entreprise" },
    el("div", { class: "monogramme", "aria-hidden": "true" }, initiales(e.nom)),
    el("div", {}, el("b", {}, e.nom || ""), el("span", {}, "Devis envoyé à " + (d?.client || "vous"))));
}

function contact(d) {
  const e = d?.entreprise || {};
  const liens = [];
  if (e.telephone) liens.push(el("a", { href: "tel:" + e.telephone.replace(/[^\d+]/g, "") }, e.telephone));
  if (e.email) liens.push(el("a", { href: "mailto:" + e.email }, e.email));
  if (!liens.length) return null;
  return el("p", { class: "contact" }, "Une question ? ", ...liens.flatMap((l, i) => i ? [" · ", l] : [l]));
}

function pied() { return el("footer", {}, "Page sécurisée · Envoyé avec Cosmo"); }

function etat(genre, symbole, titre, texte, d) {
  afficher(
    d ? entete(d) : "",
    el("div", { class: "carte etat" },
      el("div", { class: "pastille " + genre, "aria-hidden": "true" }, symbole),
      el("h1", {}, titre), texte ? el("p", {}, texte) : null),
    d ? contact(d) : null, pied());
}

async function charger() {
  if (!jeton) return etat("non", "?", "Lien incomplet", "Ouvrez le lien reçu dans votre message, en entier.");
  try {
    const r = await fetch(API + "?t=" + encodeURIComponent(jeton), { cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) return etat("non", "?", "Ce lien n'existe pas", "Vérifiez qu'il est complet, ou demandez un nouveau lien.");
    if (!r.ok) return etat("non", "!", "Page indisponible", j.error || "Réessayez dans un instant.");
    devis = j;
    chargeLe = Date.now();
    montrer();
  } catch {
    etat("non", "!", "Pas de connexion", "Vérifiez votre connexion, puis rechargez la page.");
  }
}

function montrer() {
  const d = devis;
  document.title = "Devis " + d.numero + " · " + (d.entreprise?.nom || "");
  const rep = d.reponse;
  if (rep && rep.decision === "accepte") return etat("ok", "✓", "Devis accepté", "Vous avez accepté ce devis le " + dateLongue(rep.le) + (rep.nom ? ", au nom de " + rep.nom : "") + ". Votre accord a été transmis à " + (d.entreprise?.nom || "l'entreprise") + ".", d);
  if (rep && rep.decision === "refuse") return etat("non", "✕", "Devis refusé", "Vous avez refusé ce devis le " + dateLongue(rep.le) + ". Merci de votre réponse.", d);
  if (d.remplace) return etat("info", "↻", "Ce devis a été mis à jour", (d.entreprise?.nom || "L'entreprise") + " vous a envoyé une nouvelle version. Ouvrez le lien de son dernier message.", d);
  if (d.expire) return etat("non", "⌛", "Ce devis n'est plus valable", "Il était valable jusqu'au " + dateLongue(d.valide_jusqu_au) + ". Contactez " + (d.entreprise?.nom || "l'entreprise") + " pour un devis à jour.", d);

  const t = d.totaux || {};
  const lignes = (d.lignes || []).map((l) => el("li", {},
    el("div", {}, el("div", { class: "designation" }, l.designation || ""),
      el("small", {}, nombre(l.quantite) + " " + (l.unite || "") + " × " + euros(l.prix_unitaire) + " HT" + (l.tva ? " · TVA " + nombre(l.tva) + " %" : ""))),
    el("div", { class: "prix" }, euros(l.total_ht))));

  afficher(
    entete(d),
    el("section", { class: "carte" },
      el("p", { class: "surtitre" }, "Devis " + d.numero),
      el("h1", {}, d.objet || "Votre devis"),
      el("div", { class: "montant" }, el("strong", {}, euros(t.ttc)), el("span", {}, "TTC")),
      el("p", { class: "meta" }, [d.date ? "Du " + dateLongue(d.date) : "", d.valide_jusqu_au ? "valable jusqu'au " + dateLongue(d.valide_jusqu_au) : ""].filter(Boolean).join(", "))),
    d.pdf ? el("a", { class: "bouton pdf", href: d.pdf, target: "_blank", rel: "noopener", onclick: ouvrirPDF }, "⤓  Télécharger le PDF") : null,
    rep && rep.decision === "modification"
      ? el("p", { class: "note" }, "Votre demande de modification a été transmise le " + dateLongue(rep.le) + ". Vous pouvez encore accepter ou refuser ce devis.")
      : null,
    el("section", { class: "carte", id: "choix" },
      el("h2", {}, "Votre réponse"),
      el("div", { class: "choix" },
        el("button", { class: "bouton principal", type: "button", onclick: () => formulaire("accepte") }, "J'accepte ce devis"),
        el("button", { class: "bouton secondaire", type: "button", onclick: () => formulaire("modification") }, "Demander une modification"),
        el("button", { class: "bouton discret", type: "button", onclick: () => formulaire("refuse") }, "Refuser"))),
    lignes.length ? el("section", { class: "carte" },
      el("h2", {}, "Détail"),
      el("ul", { class: "lignes" }, lignes),
      el("div", { class: "totaux" },
        el("div", {}, el("span", {}, "Total HT"), el("span", {}, euros(t.ht))),
        el("div", {}, el("span", {}, "TVA"), el("span", {}, euros(t.tva))),
        el("div", { class: "ttc" }, el("span", {}, "Total TTC"), el("span", {}, euros(t.ttc))))) : null,
    contact(d), pied());
}

/** Le lien du PDF vaut 15 minutes : passé 12 minutes, on en redemande un */
async function ouvrirPDF(ev) {
  if (Date.now() - chargeLe < 12 * 60 * 1000) return;
  ev.preventDefault();
  try {
    const r = await fetch(API + "?t=" + encodeURIComponent(jeton), { cache: "no-store" });
    const j = await r.json();
    if (j.pdf) { devis = j; chargeLe = Date.now(); location.href = j.pdf; }
  } catch { /* rien */ }
}

function formulaire(decision) {
  const d = devis;
  const zone = document.getElementById("choix");
  const erreur = el("p", { class: "erreur", role: "alert" });
  const retour = el("button", { class: "bouton discret", type: "button", onclick: montrer }, "Retour");
  let champs, bouton;
  if (decision === "accepte") {
    const nom = el("input", { type: "text", id: "nom", autocomplete: "name", autocapitalize: "words", enterkeyhint: "done", placeholder: "Prénom et nom" });
    const accord = el("input", { type: "checkbox", id: "accord" });
    bouton = el("button", { class: "bouton principal", type: "submit" }, "Confirmer mon accord");
    champs = [
      el("h2", {}, "Accepter le devis " + d.numero),
      el("label", { for: "nom" }, "Votre nom"), nom,
      el("label", { class: "case", for: "accord" }, accord,
        el("span", {}, "Bon pour accord : j'accepte ce devis de " + euros(d.totaux?.ttc) + " TTC et ses conditions.")),
    ];
    return monter(zone, champs, bouton, erreur, retour, () => {
      if (nom.value.trim().length < 2) return "Saisissez votre nom.";
      if (!accord.checked) return "Cochez « Bon pour accord ».";
      return { decision, nom: nom.value.trim(), bon_pour_accord: true };
    });
  }
  const modif = decision === "modification";
  const texte = el("textarea", { id: "texte", placeholder: modif ? "Par exemple : pouvez-vous retirer le plafond de la cuisine ?" : "Facultatif" });
  bouton = el("button", { class: modif ? "bouton fonce" : "bouton secondaire", type: "submit" }, modif ? "Envoyer ma demande" : "Confirmer le refus");
  champs = [
    el("h2", {}, modif ? "Demander une modification" : "Refuser le devis"),
    el("label", { for: "texte" }, modif ? "Qu'aimeriez-vous changer ?" : "Motif (facultatif)"), texte,
    el("p", { class: "aide" }, modif ? (d.entreprise?.nom || "L'entreprise") + " reçoit votre demande et vous répond." : "Votre réponse aide " + (d.entreprise?.nom || "l'entreprise") + " à s'organiser."),
  ];
  return monter(zone, champs, bouton, erreur, retour, () => {
    if (modif && texte.value.trim().length < 2) return "Dites ce qu'il faut modifier.";
    return { decision, commentaire: texte.value.trim() };
  });
}

function monter(zone, champs, bouton, erreur, retour, lire) {
  const form = el("form", { novalidate: true }, ...champs, bouton, erreur, retour);
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const v = lire();
    if (typeof v === "string") { erreur.textContent = v; return; }
    erreur.textContent = "";
    bouton.disabled = true;
    bouton.textContent = "Envoi…";
    try {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "repondre", t: jeton, ...v }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok || j.code === "deja") {
        devis.reponse = { decision: j.decision || v.decision, nom: v.nom || "", le: j.repondu_le || new Date().toISOString() };
        return confirmation(devis.reponse.decision);
      }
      if (j.code === "expire") { devis.expire = true; return montrer(); }
      if (j.code === "remplace") { devis.remplace = true; return montrer(); }
      erreur.textContent = j.error || "L'envoi n'a pas abouti. Réessayez.";
    } catch {
      erreur.textContent = "Pas de connexion. Réessayez dans un instant.";
    }
    bouton.disabled = false;
    bouton.textContent = "Réessayer";
  });
  zone.replaceChildren(form);
  zone.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  form.querySelector("input[type=text], textarea")?.focus({ preventScroll: true });
}

function confirmation(decision) {
  const d = devis;
  const nomE = d.entreprise?.nom || "l'entreprise";
  if (decision === "accepte") return etat("ok", "✓", "Merci, devis accepté", "Votre accord est transmis à " + nomE + ", qui revient vers vous pour la suite. Vous pouvez fermer cette page.", d);
  if (decision === "refuse") return etat("non", "✕", "Réponse envoyée", "Votre réponse est transmise à " + nomE + ". Merci d'avoir pris le temps de répondre.", d);
  return etat("info", "✎", "Demande envoyée", "Votre demande est transmise à " + nomE + ", qui vous enverra un devis mis à jour.", d);
}

charger();
</script>
</body>
</html>
